# Раздача материалов курсов через nginx (X-Accel-Redirect).
#
# Включается галкой: Настройки → Раздача материалов. Пока галка выключена,
# конфиг можно положить рядом и ничего не менять в поведении: заголовок
# X-Accel-Redirect отдаёт только включённый режим.
#
# Перед применением:
#   1. подставить свой root (каталог public приложения) и путь к контенту;
#   2. сверить путь контента с COURSES_PATH приложения;
#   3. сверить _protected-content с private_content.accel_internal
#      в config/private_content.php;
#   3a. подставить ЗНАЧЕНИЕ МЕТКИ из `php artisan content:nginx-config`
#       в заголовок X-Lms-Accel (см. ниже). Значение выводится из APP_KEY,
#       поэтому вручную его не придумать и нельзя зашить в репозиторий.
#   3b. подобрать client_max_body_size под files.chunk_bytes
#       (config/files.php). По умолчанию nginx берёт 1m, и загрузка
#       файлов будет отбиваться с 413 ещё до PHP. Подсказку печатает
#       `php artisan files:limits`.
#   4. проверить: nginx -t && systemctl reload nginx;
#   5. php artisan content:check-exposure;
#   6. открыть подписанный URL: должен быть 200 с ПУСТЫМ телом и
#      заголовком X-Accel-Redirect.
#   7. проверить загрузку файла: полоса загрузки доходит до 100% и файл
#      появляется в менеджере. Проверить автоматически:
#      tools/verify-nginx-delivery.sh
#
# Документация: docs/content-delivery.md

# sendfile включает отдачу без копирования файла в userspace. Без него
# X-Accel-Redirect работает, но выигрыша в скорости почти нет.
sendfile on;

# Метка «этот запрос пришёл через nginx».
#
# Приложение отдаёт X-Accel-Redirect ТОЛЬКО если видит этот заголовок с
# правильным значением. Без него режим nginx приводил к пустому телу со
# статусом 200: Symfony не отдаёт файл, который приложение передало
# nginx'у, а объяснить это пользователю нечем.
#
# Значение выводится командой:
#     php artisan content:nginx-config
# и выводится из APP_KEY. Подставьте сюда её вывод — в репозитории он
# лежать не должен.
proxy_set_header X-Lms-Accel "ЗАМЕНИТЬ_НА_ЗНАЧЕНИЕ_ИЗ_content:nginx-config";

server {
    listen 80;
    server_name lms.example.ru;

    # Каталог public приложения.
    root /var/www/lmslaravel/public;
    index index.php;

    # Внутренний location для материала курсов.
    #
    # internal — не украшение, а требование: такой location нельзя
    # запросить снаружи (прямой запрос даёт 404), отдать файл может
    # только nginx по заголовку X-Accel-Redirect, который формирует
    # Laravel после проверки HMAC-подписи. Уберите internal — и любой
    # сможет читать материал по прямой ссылке.
    location /_protected-content/ {
        internal;

        # Должен совпадать с courses_path приложения. Обратите внимание на
        # завершающий слеш: при alias он обязателен, иначе отбрасывается
        # последний сегмент пути.
        #
        # Путь НЕ внутри storage/app/public: иначе `php artisan storage:link`
        # откроет весь материал по /storage/... без проверки подписи.
        # Актуальное значение печатает `php artisan content:nginx-config`.
        alias /var/www/lmslaravel/storage/app/courses/private/;

        # Отдаём только то, что реально есть. Без этого появляется 200
        # с пустым телом вместо 404, и несуществующие ресурсы в документе
        # не отличить от сломанных.
        try_files $uri =404;

        # Файлы большие, MIME-типы nginx по умолчанию знает.
        types { }

        # Сжатие на уровне сервера: материал курсов — это в основном
        # html/css/js, и brotli/gzip здесь дают заметную экономию.
        gzip on;
        gzip_types text/html text/css application/javascript image/svg+xml application/json;
        brotli on;
        brotli_types text/html text/css application/javascript image/svg+xml application/json;

        # Приватный кэш: подпись одна на всех записанных на курс, общий
        # кэш отдал бы файл тому, кто её не получал.
        add_header Cache-Control "private, max-age=600, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Страховка: каталог контента лежит внутри storage/app/public, и
    # `php artisan storage:link` создаёт public/storage -> storage/app/public.
    # После этого весь материал доступен по /storage/private/... БЕЗ проверки
    # подписи. Этот блок закрывает путь даже при наличии симлинка.
    location /storage/ {
        deny all;
        return 404;
    }

    # ------------------------------------------------------------------
    # Приём загрузки файлов.
    #
    # Отдельный от материала курсов класс запросов: тело ПРИХОДИТ, а не
    # отдаётся. Файловый менеджер грузит большие файлы ПО ЧАСТЯМ
    # (POST /api/filemanager/uploads/{id}/chunk с телом
    # application/octet-stream), поэтому ограничивать нужно не файл, а
    # ОДНУ ЧАСТЬ.
    #
    # По умолчанию nginx не берёт больше 1m и отбивает такой запрос с
    # 413 ДО PHP: в логах Laravel не будет ничего, а интерфейс покажет
    # «ошибка загрузки». Значение подбирается под files.chunk_bytes
    # (config/files.php) с запасом; проверить можно
    # `php artisan files:limits`.
    client_max_body_size 8m;

    # Медленный канал: клиент шлёт 4 МБ и пропадает на полминуты. Без
    # увеличенного таймаута nginx закрывает соединение, и загрузка
    # начинается сначала — на модеме это бесконечный круг.
    client_body_timeout 300s;

    # Сколько nginx держит тело в памяти, прежде чем писать его на диск.
    # Немного: части всё равно ложатся во временный каталог приложения,
    # вторая копия на диске nginx не нужна. Каталог для тел запросов НЕ
    # задаётся явно: значение по умолчанию уже создано пакетом nginx, а
    # свой путь пришлось бы создавать вручную и он ломал бы старт.
    client_body_buffer_size 64k;

    # PHP-FPM по умолчанию ПРИНИМАЕТ тело целиком в память воркера и
    # только потом отдаёт скрипту. Файловому менеджеру это лишний расход:
    # воркер занят всё время приёма мегабайтов, хотя скрипт лишь пишет их
    # в файл. off отдаёт тело потоком и освобождает воркер сразу.
    fastcgi_request_buffering off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Заголовок X-Accel-Redirect должен доходить до браузера как есть.
    # nginx отдаёт его сам, но если ответ проходит через прокси с
    # фильтрацией заголовков, проверьте, что заголовок не срезается.
    proxy_hide_header X-Powered-By;
}
